<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>家庭密碼管理工具</title>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
<style>
body {font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 1em;}
.hidden {display: none;}
input, select, button {margin: .2em; padding: .4em;}
table {width: 100%; border-collapse: collapse; margin-top: 1em;}
th, td {border: 1px solid #ccc; padding: .5em; text-align: left;}
</style>
</head>
<body>
<div id="loginScreen">
<h2>登入</h2>
<label>密碼：<input type="password" id="loginPassword"></label>
<button onclick="login()">登入</button>
</div>

<div id="mainScreen" class="hidden">
<h2>家庭密碼管理工具</h2>
<label>身份：
<select id="userSelect" onchange="loadData()">
<option value="alice">媽媽 Alice</option>
<option value="guniu">滾牛</option>
</select>
</label>
<div>
<input placeholder="網站" id="site">
<input placeholder="帳號" id="username">
<input placeholder="密碼" id="pwd">
<button onclick="addEntry()">新增</button>
</div>
<table id="dataTable">
<thead><tr><th>網站</th><th>帳號</th><th>密碼</th><th>操作</th></tr></thead>
<tbody></tbody>
</table>
</div>

<script>
// 預設登入密碼 sha256('familySecret123')
const PASSWORD_HASH = '178a5a4ddd15f6b86a436c429a519ce777c575a43e1aef37429d35c0922fbf4a';
let masterKey = '';
let currentUser = 'alice';

function login() {
  const pass = document.getElementById('loginPassword').value;
  const hash = CryptoJS.SHA256(pass).toString();
  if (hash === PASSWORD_HASH) {
    masterKey = pass;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
    loadData();
  } else {
    alert('密碼錯誤');
  }
}

function loadData() {
  currentUser = document.getElementById('userSelect').value;
  const encrypted = localStorage.getItem('data_' + currentUser);
  let data = [];
  if (encrypted) {
    try {
      const decrypted = CryptoJS.AES.decrypt(encrypted, masterKey).toString(CryptoJS.enc.Utf8);
      data = JSON.parse(decrypted);
    } catch (e) {
      alert('解密失敗，可能是密碼錯誤');
    }
  }
  displayData(data);
}

function displayData(data) {
  const tbody = document.getElementById('dataTable').querySelector('tbody');
  tbody.innerHTML = '';
  data.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${item.site}</td><td>${item.username}</td><td>${item.password}</td>` +
      `<td><button onclick="deleteEntry(${idx})">刪除</button></td>`;
    tbody.appendChild(tr);
  });
}

function addEntry() {
  const site = document.getElementById('site').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('pwd').value.trim();
  if (!site || !username || !password) {
    alert('請填寫所有欄位');
    return;
  }
  const encrypted = localStorage.getItem('data_' + currentUser);
  let data = [];
  if (encrypted) {
    try {
      data = JSON.parse(CryptoJS.AES.decrypt(encrypted, masterKey).toString(CryptoJS.enc.Utf8));
    } catch(e) {
      data = [];
    }
  }
  data.push({site, username, password});
  saveData(data);
  document.getElementById('site').value = '';
  document.getElementById('username').value = '';
  document.getElementById('pwd').value = '';
}

function deleteEntry(index) {
  const encrypted = localStorage.getItem('data_' + currentUser);
  if (!encrypted) return;
  let data = JSON.parse(CryptoJS.AES.decrypt(encrypted, masterKey).toString(CryptoJS.enc.Utf8));
  data.splice(index, 1);
  saveData(data);
}

function saveData(data) {
  const encrypted = CryptoJS.AES.encrypt(JSON.stringify(data), masterKey).toString();
  localStorage.setItem('data_' + currentUser, encrypted);
  displayData(data);
}
</script>
</body>
</html>
